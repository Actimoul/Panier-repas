<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6B3C" />
  <title>Panier Repas</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Panier Repas</h1>
    </div>
    <button id="btn-settings" class="icon-btn" title="Réglages" aria-label="Réglages">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" role="tablist" aria-label="Navigation principale">
    <button class="tab" data-tab="semaine" role="tab">Semaine</button>
    <button class="tab" data-tab="panier" role="tab">Panier</button>
    <button class="tab" data-tab="inventaire" role="tab">Inventaire</button>
    <button class="tab" data-tab="profil" role="tab">Profil</button>
  </nav>

  <dialog id="dlg-settings" class="dialog">
    <form method="dialog" class="dialog-body" id="form-settings">
      <h2>Réglages</h2>
      <label>Clé API Anthropic
        <input type="password" id="set-api-key" placeholder="sk-ant-..." autocomplete="off" />
      </label>
      <label>Modèle
        <select id="set-model">
          <option value="claude-sonnet-5">Sonnet 5 — équilibré (recommandé)</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 — le moins cher</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6</option>
          <option value="claude-opus-5">Opus 5 — le plus fin, le plus cher</option>
        </select>
      </label>
      <p class="hint" id="set-model-cout"></p>
      <p class="hint">La clé est stockée uniquement dans ce navigateur (localStorage).</p>
      <label>URL du Worker poids (optionnel)
        <input type="url" id="set-worker-url" placeholder="https://panier-poids.xxx.workers.dev" />
      </label>
      <label>Secret du Worker
        <input type="password" id="set-worker-secret" autocomplete="off" />
      </label>
      <label>Enseigne
        <select id="set-enseigne">
          <option value="intermarche">Intermarché</option>
          <option value="leclerc">E.Leclerc</option>
          <option value="carrefour">Carrefour</option>
          <option value="auchan">Auchan</option>
          <option value="houra">Houra</option>
          <option value="coursesu">Courses U</option>
        </select>
      </label>
      <label class="switch">
        <input type="checkbox" id="set-prix-reels" />
        <span>N'utiliser que les prix relevés en magasin</span>
      </label>
      <p class="hint">Sinon, les ingrédients non relevés sont estimés à partir de prix de référence.</p>
      <label>Choix des produits : prix ↔ santé
        <input type="range" id="set-pref-sante" min="0" max="1" step="0.25" />
      </label>
      <p class="hint" id="set-pref-label"></p>
      <label>Plafond par article (€, optionnel)
        <input type="number" id="set-budget-article" step="0.5" placeholder="ex. 8" />
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Annuler</button>
        <button value="ok" class="btn primary" id="set-save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-match" class="dialog">
    <div class="dialog-body" id="dlg-match-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/aggregator.js"></script>
  <script src="js/health.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.error('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
